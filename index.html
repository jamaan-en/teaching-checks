<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>حاسبة المفاضلة - الماجستير المهني في التدريس</title>
<style>
:root{--bg:#f3f6f4;--card:#fff;--ink:#17302b;--mute:#5d726c;--line:#d5e0db;--main:#2f7a6b;--no:#b3392f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101a17;--card:#17251f;--ink:#e6f1ed;--mute:#9db3ab;--line:#2b3f37;--main:#5fb7a3;--no:#ff9288}}
:root[data-theme="dark"]{--bg:#101a17;--card:#17251f;--ink:#e6f1ed;--mute:#9db3ab;--line:#2b3f37;--main:#5fb7a3;--no:#ff9288}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic","Noto Sans Arabic",Tahoma,sans-serif;line-height:1.7}
main{max-width:520px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.45rem;line-height:1.35;margin:8px 0 4px;color:var(--main)}
.sub{color:var(--mute);margin:0 0 18px;font-size:.92rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
label{display:block;font-weight:600;margin:0 0 6px;font-size:.95rem}
.field{margin-bottom:12px}.field:last-child{margin-bottom:0}
input,select{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);min-height:44px}
input:focus-visible,select:focus-visible{outline:3px solid var(--main);outline-offset:2px}
.big{font-size:2.2rem;font-weight:800;color:var(--main);line-height:1.2}
.big small{font-size:1rem;font-weight:600;color:var(--mute)}
table{width:100%;border-collapse:collapse;margin-top:10px;font-size:.92rem}
td{padding:7px 0;border-top:1px solid var(--line)}td:last-child{text-align:left;font-weight:700}
.err{color:var(--no);font-size:.9rem}
.mute{color:var(--mute);font-size:.88rem}
</style>
</head>
<body>
<main>
<h1>حاسبة المفاضلة</h1>
<p class="sub">الماجستير المهني في التدريس: المفاضلة من 40 (اختبار التخصص 70% + المعدل 30%)</p>

<div class="card">
<div class="field"><label for="scale">نوع المعدل</label>
<select id="scale"><option value="5">من 5</option><option value="4">من 4</option><option value="100">من 100</option></select></div>
<div class="field"><label for="gpa">المعدل التراكمي</label><input id="gpa" type="number" inputmode="decimal" step="0.01" min="0" placeholder="مثال: 4.2"></div>
<div class="field"><label for="test">درجة اختبار التخصص (من 100)</label><input id="test" type="number" inputmode="decimal" step="0.01" min="0" max="100" placeholder="مثال: 62"></div>
</div>

<div class="card" id="out" aria-live="polite"><span class="mute">أدخل المعدل ودرجة الاختبار لتظهر النتيجة.</span></div>
<p class="mute">المقابلة الشخصية (60%) غير محسوبة حالياً.</p>
</main>
<script>
const $=id=>document.getElementById(id);
const r=x=>(Math.round(x*100)/100).toString();
function calc(){
 const sc=Number($('scale').value),g=parseFloat($('gpa').value),t=parseFloat($('test').value),o=$('out');
 if(isNaN(g)||isNaN(t)){o.innerHTML='<span class="mute">أدخل المعدل ودرجة الاختبار لتظهر النتيجة.</span>';return}
 if(g<0||g>sc){o.innerHTML='<span class="err">المعدل يجب أن يكون بين 0 و '+sc+'</span>';return}
 if(t<0||t>100){o.innerHTML='<span class="err">درجة الاختبار يجب أن تكون بين 0 و 100</span>';return}
 const gp=g/sc*100,gPart=gp*0.3*0.4,tPart=t*0.7*0.4;
 o.innerHTML='<div class="mute">درجتك في المفاضلة</div><div class="big">'+r(gPart+tPart)+' <small>من 40</small></div><table>'+
 '<tr><td>اختبار التخصص ('+r(t)+'%) × 70%</td><td>'+r(tPart)+' من 28</td></tr>'+
 '<tr><td>المعدل ('+r(gp)+'%) × 30%</td><td>'+r(gPart)+' من 12</td></tr></table>';
}
['scale','gpa','test'].forEach(i=>$(i).addEventListener('input',calc));
</script>
<script data-goatcounter="https://teaching-check.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
